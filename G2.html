.aqua{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:43px}
.blob{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;mix-blend-mode:screen;animation:drift 14s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:#00e5ff;top:-60px;right:-70px}
.b2{width:300px;height:300px;background:#7b2ff7;bottom:-90px;left:-80px;animation-delay:-5s}
.b3{width:220px;height:220px;background:#ff4ecd;top:35%;left:-60px;animation-delay:-9s}
.b4{width:200px;height:200px;background:#00ffa3;bottom:20%;right:-50px;animation-delay:-3s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(36px,42px) scale(1.18)}}
.shine{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.14) 45%,rgba(255,255,255,0) 60%);background-size:250% 250%;animation:sh 7s ease-in-out infinite;pointer-events:none}
@keyframes sh{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.view{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;transition:opacity .6s,transform .6s}
.hide{opacity:0;pointer-events:none;transform:scale(1.04)}
.isl{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:88px;height:24px;background:#000;border-radius:14px;z-index:30}
.sbar{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:2px 22px 0;color:#fff;font-size:12px;font-weight:600;z-index:20;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.lockTime{color:#fff;font-size:56px;font-weight:700;margin-top:86px;text-shadow:0 4px 18px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.lockDate{color:rgba(255,255,255,.92);font-size:14px;margin-top:2px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.padlock{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;margin-top:14px;border:1px solid rgba(255,255,255,.35)}
.dots{display:flex;gap:14px;margin-top:12px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);transition:.15s}
.dot.on{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.9)}
.keypad{display:grid;grid-template-columns:repeat(3,66px);gap:13px;margin-top:auto;margin-bottom:46px}
.key{width:66px;height:66px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);backdrop-filter:blur(8px);color:#fff;font-size:25px;font-weight:500;cursor:pointer;transition:.12s;display:flex;align-items:center;justify-content:center}
.key:active{transform:scale(.92);background:rgba(255,255,255,.32)}
.hint{color:rgba(255,255,255,.75);font-size:11px;margin-top:8px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.wcard{margin:auto;text-align:center;padding:26px 24px;border-radius:26px;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);box-shadow:0 18px 50px rgba(0,0,0,.35);animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.spark{font-size:34px;animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.18) rotate(6deg)}}
.wname{color:#fff;font-size:34px;font-weight:800;margin:8px 0 4px;text-shadow:0 3px 14px rgba(0,0,0,.4)}
.wtxt{color:rgba(255,255,255,.92);font-size:14px;line-height:1.9}
.wbtn{margin-top:16px;padding:11px 34px;border-radius:22px;border:none;background:linear-gradient(135deg,#00e5ff,#7b2ff7,#ff4ecd);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(123,47,247,.5)}
.wbtn:active{transform:scale(.95)}
.glass{background:rgba(20,20,28,.35);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22)}
.hname{color:#fff;font-size:21px;font-weight:800;margin:60px 0 2px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.hsub{color:rgba(255,255,255,.85);font-size:12px;margin-bottom:14px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;width:272px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none}
.ic{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 2px rgba(255,255,255,.4);transition:.15s}
.app:active .ic{transform:scale(.9)}
.app span{color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 5px rgba(0,0,0,.7)}
.dock{position:absolute;bottom:24px;left:14px;right:14px;height:78px;border-radius:24px;display:flex;justify-content:space-around;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:2px;background:rgba(255,255,255,.85);z-index:25}
.wa{background:linear-gradient(145deg,#2ee06f,#0aa14a)}
.tk{background:linear-gradient(145deg,#3a3a44,#000)}
.sn{background:linear-gradient(145deg,#fff36b,#ffd500)}
.ig{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.tg{background:linear-gradient(145deg,#4db8f5,#1e88d8)}
</style>

<script>
(function(){
  var keys=[1,2,3,4,5,6,7,8,9,'',0,'⌫'],kp=document.getElementById('keypad'),code='',dots=document.querySelectorAll('#dots .dot');
  keys.forEach(function(k){
    var b=document.createElement('button');b.className='key';b.textContent=k;
    if(k===''){b.style.visibility='hidden'}
    b.onclick=function(){
      if(k==='⌫'){code=code.slice(0,-1)}
      else if(code.length<4){code+=k}
      dots.forEach(function(d,i){d.classList.toggle('on',i<code.length)});
      if(code.length===4){setTimeout(unlock,220)}
    };
    kp.appendChild(b);
  });
  function unlock(){
    var lv=document.getElementById('lockView');
    lv.style.transition='.5s';lv.style.opacity='0';lv.style.transform='scale(1.1)';lv.style.pointerEvents='none';
    setTimeout(function(){lv.classList.add('hide');document.getElementById('welcomeView').classList.remove('hide')},480);
  }
  document.getElementById('goHome').onclick=function(){
    document.getElementById('welcomeView').classList.add('hide');
    document.getElementById('homeView').classList.remove('hide');
  };
  function tick(){
    var d=new Date(),t=d.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
    ['clock1','clock2','clock3','clock4'].forEach(function(id){document.getElementById(id).textContent=t});
    document.getElementById('dateTxt').textContent=d.toLocaleDateString('ar-IQ',{weekday:'long',day:'numeric',month:'long'});
  }
  tick();setInterval(tick,15000);
})();
</script>
